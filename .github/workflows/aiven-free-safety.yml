name: Render Free + Aiven Free safety

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/render-aiven-preflight.mjs
      - scripts/aiven-free-test-bootstrap.mjs
      - .github/workflows/aiven-free-safety.yml
      - docs/render-aiven-free.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: No credentials / no accidental database writes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
      - name: Install dependencies for real guard execution
        run: npm ci --no-audit --no-fund
      - name: Syntax check safety scripts
        run: |
          node --check scripts/render-aiven-preflight.mjs
          node --check scripts/aiven-free-test-bootstrap.mjs
      - name: Verify missing credentials fail closed
        run: |
          set -euo pipefail
          if node scripts/render-aiven-preflight.mjs; then
            echo "Unsafe: Render preflight started without a verified Aiven connection"
            exit 1
          fi
          if node scripts/aiven-free-test-bootstrap.mjs; then
            echo "Unsafe: bootstrap ran without explicit approval and credentials"
            exit 1
          fi
