name: Oracle ARM64 readiness

# Native ARM64 verification for the private ABDALLAH-SYSTEM repository.
# No Oracle credentials and no production database access are involved.
on:
  pull_request:
    paths:
      - ".github/workflows/oracle-arm64-readiness.yml"
      - "deploy/oracle/**"
      - "docs/oracle-always-free.md"
      - "scripts/oracle-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - "server/**"
      - "shared/**"
      - "drizzle.config.ts"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_oracle_check
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: arm64-ci-temporary-only
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_oracle_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_oracle_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install architecture-specific optional dependencies
        run: npm ci --include=optional --no-audit
      - name: Exercise Node native libraries on Linux ARM64
        run: node scripts/oracle-arm64-check.mjs
      - name: Build frontend and backend natively on ARM64
        run: npm run build
      - name: Verify PostgreSQL scratch database starts empty
        run: node scripts/oracle-db-preflight.mjs --empty
      - name: Provision declared schema in a DISPOSABLE CI database only
        env:
          ORACLE_BOOTSTRAP_NEW_DATABASE: "YES"
        run: node scripts/oracle-bootstrap-empty-db.mjs
      - name: Verify core tables exist after disposable schema creation
        run: node scripts/oracle-db-preflight.mjs --ready
      - name: Reject a second bootstrap on an already initialized database
        env:
          ORACLE_BOOTSTRAP_NEW_DATABASE: "YES"
        run: |
          if node scripts/oracle-bootstrap-empty-db.mjs; then
            echo "Unsafe: bootstrap accepted a populated DB!"
            exit 1
          fi
          if node scripts/oracle-db-preflight.mjs --empty; then
            echo "Unsafe: empty preflight accepted a populated DB!"
            exit 1
          fi
          echo "Expected: both write-protection checks rejected the populated DB."
      - name: Validate deployment shell scripts
        run: bash -n deploy/oracle/*.sh
      - name: Smoke-test first application boot on disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          npm start > "$RUNNER_TEMP/oracle-first-boot.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; tail -n 80 "$RUNNER_TEMP/oracle-first-boot.log"' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5000/api/health/db > "$RUNNER_TEMP/oracle-health.json"; then
              if node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.exit(j.migrations?.completed ? 0 : 1)" "$RUNNER_TEMP/oracle-health.json"; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "ERP exited during first boot"
              exit 1
            fi
            sleep 3
          done
          test "$ready" -eq 1 || { echo "ERP did not finish first-boot migrations"; exit 1; }
          node scripts/verify-startup-migrations.mjs --report "$RUNNER_TEMP/oracle-health.json" --label "Oracle ARM64 first boot"
          curl --fail --silent --show-error http://127.0.0.1:5000/api/health/ready > /dev/null
