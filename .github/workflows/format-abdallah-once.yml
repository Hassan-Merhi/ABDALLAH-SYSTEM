name: Format Abdallah POS and container changes (one shot)
on:
  push:
    branches:
      - fix/pos-admin-bale-cost-and-a-z-lists
    paths:
      - .github/workflows/format-abdallah-once.yml

permissions:
  contents: write

jobs:
  format-changed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Format only the affected files
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/lib/itemNameSort.ts \
            client/src/pages/POImport.tsx \
            client/src/pages/SpPOImport.tsx \
            client/src/pages/containerdetail/components/ContainerDetailErpView.tsx \
            client/src/pages/containers/useContainerFilters.ts \
            client/src/pages/pos/POS.tsx \
            client/src/pages/pos/hooks/posInventory.test.ts \
            client/src/pages/pos/hooks/posInventory.ts \
            client/src/pages/pos/pos-components/PosMobileLayout.tsx \
            client/src/pages/pos/utils/posCalculations.adminColumns.test.ts \
            client/src/pages/pos/utils/posCalculations.ts \
            shared/containerNumberSort.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/lib/itemNameSort.ts \
            client/src/pages/POImport.tsx \
            client/src/pages/SpPOImport.tsx \
            client/src/pages/containerdetail/components/ContainerDetailErpView.tsx \
            client/src/pages/containers/useContainerFilters.ts \
            client/src/pages/pos/POS.tsx \
            client/src/pages/pos/hooks/posInventory.test.ts \
            client/src/pages/pos/hooks/posInventory.ts \
            client/src/pages/pos/pos-components/PosMobileLayout.tsx \
            client/src/pages/pos/utils/posCalculations.adminColumns.test.ts \
            client/src/pages/pos/utils/posCalculations.ts \
            shared/containerNumberSort.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Abdallah POS and container changes"
            git push origin HEAD:fix/pos-admin-bale-cost-and-a-z-lists
          fi
