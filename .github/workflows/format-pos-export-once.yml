name: Format POS export and mobile edits (one shot)
on:
  push:
    branches:
      - fix/pos-admin-bale-cost-and-a-z-lists
    paths:
      - .github/workflows/format-pos-export-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Format POS files only
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --bin-links=true
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/pos/hooks/usePosInvoiceActions.ts \
            client/src/pages/pos/POS.tsx \
            client/src/pages/pos/pos-components/PosMobileLayout.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/pos/hooks/usePosInvoiceActions.ts client/src/pages/pos/POS.tsx client/src/pages/pos/pos-components/PosMobileLayout.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format POS export and mobile language changes"
            git push origin HEAD:fix/pos-admin-bale-cost-and-a-z-lists
          fi
